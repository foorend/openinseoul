<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OPEN IN SEOUL : CAFE — 썸네일 생성기</title>
    <style>
      html, body { margin: 0; background: #0c0908; }
      canvas { display: block; width: 1600px; height: 900px; }
    </style>
  </head>
  <body>
    <canvas id="thumb" width="1600" height="900"></canvas>
    <script type="module">
      import {
        PALETTE, alpha, mix, roundRect, glowDot, lightCone, vignette, grain, figure,
      } from "../src/visuals.js?release=20261006";

      const W = 1600;
      const H = 900;
      const ctx = document.querySelector("#thumb").getContext("2d");
      const SPLIT = 560;          // 왼쪽 타이포 패널 폭
      const t = 1.15;             // 애니메이션 위상 고정 (샷이 내려오는 순간)

      // ── 오른쪽: 블루아워 서울 골목의 카페 단면 ──────────────
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#0A1020");
      sky.addColorStop(0.45, "#182036");
      sky.addColorStop(0.78, "#3A2B34");
      sky.addColorStop(1, "#120D0B");
      ctx.fillStyle = sky;
      ctx.fillRect(SPLIT, 0, W - SPLIT, H);

      for (let i = 0; i < 90; i += 1) {
        const x = SPLIT + ((i * 173.3) % (W - SPLIT));
        const y = (i * 97.7) % 320;
        ctx.globalAlpha = 0.18 + ((i * 37) % 60) / 100;
        ctx.fillStyle = "#EFE6D8";
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;

      // 남산 능선 + 서울타워
      ctx.fillStyle = "#0D1424";
      ctx.beginPath();
      ctx.moveTo(SPLIT, 420);
      ctx.quadraticCurveTo(900, 214, 1330, 420);
      ctx.lineTo(1330, 460);
      ctx.lineTo(SPLIT, 460);
      ctx.closePath();
      ctx.fill();
      (function tower(x, baseY, s) {
        ctx.save();
        ctx.translate(x, baseY);
        ctx.scale(s, s);
        ctx.fillStyle = "#0D1424";
        ctx.fillRect(-5, -86, 10, 86);
        ctx.beginPath(); ctx.ellipse(0, -94, 19, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(-3, -142, 6, 48);
        ctx.beginPath();
        ctx.moveTo(-3, -142); ctx.lineTo(0, -166); ctx.lineTo(3, -142); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        glowDot(ctx, x, baseY - 166 * s, 40, "#F4511E", 0.75);
        ctx.restore();
      })(940, 296, 1.05);

      // 배경 아파트/오피스
      const towers = [
        [SPLIT - 10, 300, 120, 4, 7], [700, 250, 96, 3, 8], [1360, 236, 118, 4, 9], [1470, 296, 140, 4, 7],
      ];
      for (const [x, y, w, cols, rows] of towers) {
        ctx.fillStyle = "#141B2B";
        ctx.fillRect(x, y, w, 470 - y);
        const pad = 12;
        const cw = (w - pad * 2) / cols;
        const ch = (470 - y - 18) / rows;
        for (let r = 0; r < rows; r += 1) {
          for (let c = 0; c < cols; c += 1) {
            const lit = ((r * 13 + c * 29 + x) % 100) / 100 < 0.55;
            ctx.fillStyle = lit ? alpha(PALETTE.cremaSoft, 0.72) : "rgba(10,14,22,.6)";
            ctx.fillRect(x + pad + c * cw, y + 12 + r * ch, Math.max(3, cw - 6), Math.max(4, ch - 8));
          }
        }
      }

      // 카페 파사드
      const SX = 700, SW = 700, SIGN_Y = 400, SIGN_H = 74, FLOOR = 760;
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.fillRect(SX + 16, SIGN_Y + 16, SW, FLOOR - SIGN_Y);
      ctx.fillStyle = "#17120F";
      ctx.fillRect(SX - 14, SIGN_Y - 12, SW + 28, FLOOR - SIGN_Y + 12);

      // 간판
      ctx.fillStyle = "#1B1512";
      ctx.fillRect(SX - 14, SIGN_Y - 12, SW + 28, SIGN_H);
      ctx.save();
      ctx.shadowColor = PALETTE.crema;
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#F6EEDF";
      ctx.font = "800 34px 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("구름상점", SX + 14, SIGN_Y + 32);
      ctx.restore();
      ctx.fillStyle = PALETTE.copper;
      ctx.font = "700 13px ui-monospace, monospace";
      ctx.fillText("SPECIALTY COFFEE · SEONGSU", SX + 16, SIGN_Y + 54);
      ctx.fillStyle = PALETTE.crema;
      ctx.fillRect(SX + SW - 148, SIGN_Y - 12, 162, SIGN_H);
      ctx.fillStyle = "#100C0A";
      ctx.font = "900 19px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("OPEN", SX + SW - 67, SIGN_Y + 22);
      ctx.font = "700 11px ui-monospace, monospace";
      ctx.fillText("07:00 — 20:00", SX + SW - 67, SIGN_Y + 44);

      // 실내
      const IY = SIGN_Y + SIGN_H - 12;
      const IH = FLOOR - IY;
      const warm = ctx.createLinearGradient(SX, IY, SX, FLOOR);
      warm.addColorStop(0, "#F6E3BC");
      warm.addColorStop(1, "#C99552");
      ctx.fillStyle = warm;
      ctx.fillRect(SX, IY, SW, IH);

      // 실내 바닥
      const FLOOR_IN = FLOOR - 54;
      ctx.fillStyle = mix("#C9A87A", "#8A6A44", 0.4);
      ctx.fillRect(SX, FLOOR_IN, SW, FLOOR - FLOOR_IN);
      ctx.strokeStyle = alpha("#6B4A2E", 0.4);
      ctx.lineWidth = 1.5;
      for (let fx = SX; fx < SX + SW; fx += 54) {
        ctx.beginPath(); ctx.moveTo(fx, FLOOR_IN); ctx.lineTo(fx - 22, FLOOR); ctx.stroke();
      }

      // 바 카운터
      const BAR_Y = IY + IH * 0.56;
      const bar = ctx.createLinearGradient(SX, BAR_Y, SX, FLOOR);
      bar.addColorStop(0, "#6B4A34");
      bar.addColorStop(1, "#3A2718");
      ctx.fillStyle = bar;
      ctx.fillRect(SX + 10, BAR_Y, SW * 0.46, FLOOR_IN - BAR_Y + 16);
      ctx.fillStyle = alpha("#EFE6D8", 0.2);
      ctx.fillRect(SX + 10, BAR_Y, SW * 0.46, 5);

      // 에스프레소 머신 + 샷
      (function machine(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        const body = ctx.createLinearGradient(0, -52, 0, 8);
        body.addColorStop(0, "#4E5359");
        body.addColorStop(0.45, "#2C3034");
        body.addColorStop(1, "#171A1D");
        ctx.fillStyle = body;
        roundRect(ctx, -74, -52, 148, 60, 8); ctx.fill();
        ctx.fillStyle = alpha("#E8F0F5", 0.3);
        roundRect(ctx, -70, -49, 140, 7, 3); ctx.fill();
        ctx.fillStyle = "#12151A";
        roundRect(ctx, -64, -38, 128, 19, 3); ctx.fill();
        for (const gx of [-30, 30]) {
          ctx.fillStyle = "#14171A";
          ctx.fillRect(gx - 13, 6, 26, 15);
          ctx.strokeStyle = alpha("#8A5326", 0.95);
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(gx, 21); ctx.lineTo(gx, 38); ctx.stroke();
          ctx.fillStyle = "#FBF6EC";
          roundRect(ctx, gx - 10, 38, 20, 15, 3); ctx.fill();
          ctx.fillStyle = PALETTE.crema;
          roundRect(ctx, gx - 9, 38, 18, 4.5, 2); ctx.fill();
        }
        ctx.strokeStyle = "#9DA5AC";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(70, -18); ctx.lineTo(82, 12); ctx.stroke();
        ctx.restore();
        for (let i = 0; i < 4; i += 1) {
          const p = (t * 0.7 + i * 0.25) % 1;
          ctx.globalAlpha = (1 - p) * 0.42;
          ctx.fillStyle = "#FFF";
          ctx.beginPath();
          ctx.arc(x + 82 * s + Math.sin(p * 6) * 6, y + 12 * s - p * 62, (4 + p * 11) * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      })(SX + 128, BAR_Y - 6, 1.0);

      // 바리스타
      figure(ctx, SX + 268, FLOOR_IN + 6, 1.3, "#EDE5D4", { hat: "cap", facing: -1, walk: 2.2 });

      // 쇼케이스
      (function showcase(x, y, w, h) {
        ctx.fillStyle = "#6B4A34";
        roundRect(ctx, x, y, w, h, 5); ctx.fill();
        const glass = ctx.createLinearGradient(x, y, x + w, y + h);
        glass.addColorStop(0, alpha("#CFE3EA", 0.4));
        glass.addColorStop(0.5, alpha("#CFE3EA", 0.14));
        glass.addColorStop(1, alpha("#CFE3EA", 0.34));
        ctx.fillStyle = glass;
        roundRect(ctx, x + 5, y + 5, w - 10, h - 10, 4); ctx.fill();
        for (let r = 0; r < 2; r += 1) {
          const sy = y + 22 + r * (h - 34) / 2;
          ctx.fillStyle = "#5A3E2C";
          ctx.fillRect(x + 8, sy + 13, w - 16, 3);
          for (let i = 0; i < 5; i += 1) {
            ctx.fillStyle = ["#E8C079", "#D9A45C", "#C98A45"][i % 3];
            ctx.beginPath();
            ctx.ellipse(x + 24 + i * ((w - 40) / 5), sy + 6, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      })(SX + SW * 0.58, BAR_Y - 78, SW * 0.36, 118);

      // 홀 손님
      // 홀 테이블 + 앉은 손님
      for (let i = 0; i < 2; i += 1) {
        const tx = SX + SW * (0.68 + i * 0.19);
        ctx.fillStyle = "#5F4433";
        ctx.fillRect(tx - 34, FLOOR_IN - 34, 68, 9);
        ctx.fillRect(tx - 5, FLOOR_IN - 25, 10, 25);
      }
      figure(ctx, SX + SW * 0.63, FLOOR_IN + 2, 1.08, "#4A5A6E", { seated: true, prop: "laptop", facing: 1 });
      figure(ctx, SX + SW * 0.82, FLOOR_IN + 2, 1.04, "#7A5A6E", { seated: true, prop: "cup", facing: -1 });

      // 펜던트 조명
      for (let i = 0; i < 3; i += 1) {
        const lx = SX + SW * (0.2 + i * 0.3);
        ctx.strokeStyle = "#3A3833";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(lx, IY); ctx.lineTo(lx, IY + 40); ctx.stroke();
        ctx.fillStyle = PALETTE.copper;
        ctx.beginPath();
        ctx.moveTo(lx - 13, IY + 40); ctx.lineTo(lx + 13, IY + 40);
        ctx.lineTo(lx + 8, IY + 56); ctx.lineTo(lx - 8, IY + 56);
        ctx.closePath(); ctx.fill();
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        glowDot(ctx, lx, IY + 62, 70, PALETTE.cremaSoft, 0.5);
        ctx.restore();
      }

      // 인도 · 도로 · 젖은 반사
      ctx.fillStyle = "#221C18";
      ctx.fillRect(SPLIT, FLOOR, W - SPLIT, 70);
      ctx.fillStyle = "#12100F";
      ctx.fillRect(SPLIT, FLOOR + 70, W - SPLIT, H - FLOOR - 70);
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const wet = ctx.createLinearGradient(0, FLOOR, 0, H);
      wet.addColorStop(0, alpha(PALETTE.crema, 0.34));
      wet.addColorStop(1, alpha(PALETTE.crema, 0));
      ctx.fillStyle = wet;
      ctx.fillRect(SX - 80, FLOOR, SW + 160, H - FLOOR);
      ctx.restore();

      // 대기 줄 + 배달 스쿠터
      const queue = ["#3A6E92", "#4E7A58", "#B4674D", "#6E6BA8"];
      queue.forEach((color, i) => {
        figure(ctx, SX + SW - 6 + i * 44, FLOOR + 54, 1.02, color, { facing: -1, prop: i % 2 ? "cup" : "phone", walk: i });
      });
      figure(ctx, SPLIT + 96, FLOOR + 56, 1.05, "#8A6BA8", { facing: 1, prop: "cup", walk: 1.4 });
      (function scooter(x, y) {
        ctx.strokeStyle = "#1B1C18";
        ctx.fillStyle = "#1B1C18";
        ctx.lineWidth = 4;
        for (const wx of [-24, 22]) { ctx.beginPath(); ctx.arc(x + wx, y, 11, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = PALETTE.copper;
        roundRect(ctx, x - 30, y - 20, 40, 14, 5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 12, y - 16); ctx.lineTo(x + 24, y - 40); ctx.stroke();
        ctx.fillStyle = "#20242C";
        roundRect(ctx, x - 40, y - 46, 21, 21, 4); ctx.fill();
      })(SPLIT + 236, FLOOR + 92);

      // 창에서 쏟아지는 빛 + 후처리
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      lightCone(ctx, SX + SW / 2, FLOOR - 20, 620, 190, PALETTE.cremaSoft, 0.26);
      glowDot(ctx, SX + SW / 2, BAR_Y - 40, 420, PALETTE.crema, 0.24);
      ctx.restore();
      vignette(ctx, W, H, 0.5);

      // ── 왼쪽: 타이포 패널 ─────────────────────────────────
      ctx.fillStyle = "#14100D";
      ctx.fillRect(0, 0, SPLIT, H);
      ctx.fillStyle = alpha(PALETTE.crema, 0.5);
      ctx.fillRect(SPLIT - 2, 0, 2, H);

      ctx.textAlign = "left";
      ctx.fillStyle = PALETTE.muted;
      ctx.font = "600 15px ui-monospace, monospace";
      ctx.fillText("K O R E A N   C A F E   S T A R T U P", 68, 150);

      // 패널 폭 안에 반드시 들어가도록 글자 크기를 재서 맞춘다
      const titleMax = SPLIT - 68 - 56;
      let titleSize = 118;
      const titleFont = (size) => `800 ${size}px 'Apple SD Gothic Neo', 'Helvetica Neue', system-ui, sans-serif`;
      while (titleSize > 60) {
        ctx.font = titleFont(titleSize);
        if (ctx.measureText("IN SEOUL").width <= titleMax) break;
        titleSize -= 2;
      }
      ctx.font = titleFont(titleSize);
      ctx.fillStyle = "#F6EEDF";
      ctx.fillText("OPEN", 66, 292);
      ctx.fillText("IN ", 66, 292 + titleSize * 0.92);
      const inWidth = ctx.measureText("IN ").width;
      ctx.fillStyle = PALETTE.crema;
      ctx.fillText("SEOUL", 66 + inWidth, 292 + titleSize * 0.92);

      ctx.fillStyle = alpha(PALETTE.crema, 0.6);
      ctx.fillRect(68, 292 + titleSize * 0.92 + 42, 380, 2);

      ctx.fillStyle = PALETTE.copper;
      ctx.font = "700 30px ui-monospace, monospace";
      ctx.fillText(":  C A F E", 66, 496);

      ctx.fillStyle = "#C4B6A5";
      ctx.font = "600 21px 'Apple SD Gothic Neo', system-ui, sans-serif";
      ctx.fillText("1월부터 12월까지,", 68, 576);
      ctx.fillText("연말정산까지 버티는 첫 1년.", 68, 610);

      // 하단 스탯 바
      ctx.fillStyle = alpha("#EFE6D8", 0.12);
      ctx.fillRect(68, 674, 424, 1);
      const stats = [
        ["상권", "5"],
        ["캠페인", "12개월"],
        ["결산", "종합소득세"],
      ];
      stats.forEach(([label, value], i) => {
        const x = 68 + i * 146;
        ctx.fillStyle = PALETTE.muted;
        ctx.font = "600 11px ui-monospace, monospace";
        ctx.fillText(label.toUpperCase(), x, 706);
        ctx.fillStyle = "#F6EEDF";
        ctx.font = "700 20px 'Apple SD Gothic Neo', system-ui, sans-serif";
        ctx.fillText(value, x, 734);
      });

      // 시그니처 문장
      ctx.fillStyle = PALETTE.crema;
      ctx.font = "700 19px 'Apple SD Gothic Neo', system-ui, sans-serif";
      ctx.fillText("당신은 몇 시간 일해서,", 68, 806);
      ctx.fillText("시급 얼마를 벌었나.", 68, 836);

      grain(ctx, W, H, 0.045);
      document.title = "READY";
    </script>
  </body>
</html>
